<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PawsCare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">
  <div class="brand">🐾 PawsCare</div>
  <nav>
    <a onclick="showPage('home')">Home</a>
    <a onclick="showPage('report')">Report</a>
    <a onclick="showPage('browse')">Browse</a>
    <a onclick="showPage('adopt')">Adopt</a>
  </nav>
</header>

<main>

<!-- HOME -->
<section id="home" class="page active">
  <div class="hero">
    <h1>Save a Paw, Save a Life 🐾</h1>
    <p>Helping animals with real-time reporting</p>

    <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b" class="hero-img">

    <div class="hero-btns">
      <button onclick="showPage('report')">Report Animal</button>
      <button onclick="showPage('browse')">Browse Reports</button>
    </div>
  </div>

  <div class="dashboard">
    <h3>Total Reports</h3>
    <h1 id="totalReports">0</h1>
  </div>
</section>

<!-- REPORT -->
<section id="report" class="page">
  <div class="card">
    <h2>Report Animal</h2>

    <form id="reportForm">
      <input id="reporterName" placeholder="Name">
      <input id="reporterContact" placeholder="Contact" required>
      <input id="animalType" placeholder="Animal Type" required>
      <input id="location" placeholder="Location" required>
      <textarea id="description" placeholder="Description"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</section>

<!-- BROWSE -->
<section id="browse" class="page">
  <h2 class="title">Reports</h2>
  <div id="reportList"></div>
</section>

<!-- ADOPT -->
<section id="adopt" class="page">
  <div class="card">
    <h2>Adopt</h2>

    <form id="adoptForm">
      <input id="adopterName" placeholder="Name" required>
      <input id="adopterContact" placeholder="Contact" required>
      <input id="preferredAnimal" placeholder="Animal">
      <textarea id="adoptReason" placeholder="Reason"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</section>

</main>

<footer>
  <p>© PawsCare</p>
</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
